name: Print Prettier diff (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show exact Prettier changes
        run: |
          npx prettier --write src/intune-audit-tools.ts test/intune-audit-tools.test.ts
          git diff -- src/intune-audit-tools.ts test/intune-audit-tools.test.ts
