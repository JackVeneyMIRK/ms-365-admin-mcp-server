name: Temporary Prettier diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/intune-audit-tools.ts
          git diff -- src/intune-audit-tools.ts
