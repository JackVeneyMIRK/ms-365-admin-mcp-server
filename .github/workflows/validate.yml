name: Validate MCP server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Generate Microsoft Graph client
        run: npm run generate
      - name: TypeScript build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Automated tests
        run: npm test
      - name: Build deployment image without publishing
        run: docker build -t ms365-admin-mcp:validation .
      - name: Confirm deployment profile refuses missing credentials
        run: |
          if output=$(docker run --rm -e MS365_ADMIN_MCP_DEPLOYMENT_PROFILE=intune-read-only ms365-admin-mcp:validation 2>&1); then
            echo "Deployment profile unexpectedly started without configuration"
            exit 1
          fi
          [[ "$output" == *"Deployment profile requires MS365_ADMIN_MCP_TENANT_ID"* ]]
