name: One-time dependency repair

on:
  push:
    branches: [ci/validate-intune-mcp]
    paths:
      - .github/workflows/dependency-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'JackVeneyMIRK/ms-365-admin-mcp-server'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade npm to latest supported major
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Apply nonbreaking npm audit fixes
        run: npm audit fix
      - name: Enforce production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify
        run: npm run verify
      - name: Commit dependency lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "fix: refresh vulnerable npm dependencies"
            git push origin HEAD:ci/validate-intune-mcp
          fi
